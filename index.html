<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>
   
    <div id="container">
        <div id="header">
            <input type="text" spellcheck="false" placeholder="Please,enter city..." id="input">
        </div>
       
        <div id="when-where">
            <p id="city">New York,NY</p>
            <p id="date">Saturday February 17 2024</p>
        </div>

        <div id="now">
            <p id="temperature">28°</p>
            <p id="feelsLike">25°</p>
            <p id="condition">sunny</p>
            <p id="variation">min:24° max:28°</p>
        </div>

    </div>
    







    <script src="script.js"></script>
</body>
</html>
